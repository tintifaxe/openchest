<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openchest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%23D9A441' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 34 H50 V48 a4 4 0 0 1 -4 4 H18 a4 4 0 0 1 -4 -4 Z'/%3E%3Cpath d='M44 34 A30 30 0 0 0 24.26 5.81'/%3E%3Cpath d='M38 34 A24 24 0 0 0 22.21 11.45'/%3E%3Cpath d='M32 34 A18 18 0 0 0 20.16 17.09'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f8f6f1;
    --ink: #0e1b2a;
    --muted: #6b7280;
    --line: #d9d4c8;
    --gold: #d9a441;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1b2a;
      --ink: #f2ede4;
      --muted: #8a94a3;
      --line: #24344a;
      --card: #14243a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
  }
  main {
    width: 100%;
    max-width: 22rem;
    text-align: center;
  }
  .mark { width: 72px; height: 72px; color: var(--ink); }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0.75rem 0 2rem;
  }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.5rem;
    display: grid;
    gap: 0.85rem;
    text-align: left;
  }
  label {
    font-size: 0.8rem;
    color: var(--muted);
    display: grid;
    gap: 0.3rem;
  }
  input {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    width: 100%;
  }
  input:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #0e1b2a;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    padding: 0.65rem;
    cursor: pointer;
    margin-top: 0.4rem;
  }
  button:hover { filter: brightness(1.06); }
  #notice {
    min-height: 1.4rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 34 H50 V48 a4 4 0 0 1 -4 4 H18 a4 4 0 0 1 -4 -4 Z"/>
    <path d="M44 34 A30 30 0 0 0 24.26 5.81"/>
    <path d="M38 34 A24 24 0 0 0 22.21 11.45"/>
    <path d="M32 34 A18 18 0 0 0 20.16 17.09"/>
    <path fill="#D9A441" stroke="none" d="M50 9.5 q1.2 4.3 5.5 5.5 q-4.3 1.2 -5.5 5.5 q-1.2 -4.3 -5.5 -5.5 q4.3 -1.2 5.5 -5.5 Z"/>
    <g fill="#D9A441" stroke="none">
      <circle cx="32" cy="41" r="2.6"/>
      <path d="M32 42.5 l-1.8 4.2 h3.6 Z"/>
    </g>
  </svg>
  <h1>openchest</h1>
  <form id="login">
    <label>Email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Open</button>
  </form>
  <p id="notice"></p>
</main>
<script>
  // Placeholder: replace this handler with a real authentication call later.
  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('notice').textContent = 'The chest isn’t open yet — come back soon.';
  });
</script>
</body>
</html>
