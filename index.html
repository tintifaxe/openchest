<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openchest</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f8f6f1;
    --ink: #0e1b2a;
    --muted: #6b7280;
    --line: #d9d4c8;
    --gold: #d9a441;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1b2a;
      --ink: #f2ede4;
      --muted: #8a94a3;
      --line: #24344a;
      --card: #14243a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
  }
  main {
    width: 100%;
    max-width: 22rem;
    text-align: center;
  }
  .mark { width: 72px; height: 72px; color: var(--ink); }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0.75rem 0 2rem;
  }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.5rem;
    display: grid;
    gap: 0.85rem;
    text-align: left;
  }
  label {
    font-size: 0.8rem;
    color: var(--muted);
    display: grid;
    gap: 0.3rem;
  }
  input {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    width: 100%;
  }
  input:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #0e1b2a;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    padding: 0.65rem;
    cursor: pointer;
    margin-top: 0.4rem;
  }
  button:hover { filter: brightness(1.06); }
  #notice {
    min-height: 1.4rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer {
    margin-top: 1.5rem;
    font-size: 0.75rem;
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <mask id="mark-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
        <rect width="64" height="64" fill="#fff"/>
        <circle cx="23" cy="15.5" r="1.8" fill="#000"/>
        <circle cx="41" cy="15.5" r="1.8" fill="#000"/>
        <circle cx="32" cy="40.5" r="2.2" fill="#000"/>
        <path d="M32 42 L30.4 45.5 L33.6 45.5 Z" fill="#000"/>
      </mask>
    </defs>
    <path fill="#D9A441" d="M10 23.5 Q32 17 54 23.5 L54 30 Q32 23.5 10 30 Z"/>
    <g fill="currentColor" mask="url(#mark-cutouts)">
      <path d="M10 25 C10 13.5 19 7.5 32 7.5 C45 7.5 54 13.5 54 25 Q32 18.5 10 25 Z"/>
      <path d="M10 32 Q32 25.5 54 32 L54 38.5 Q32 32 10 38.5 Z"/>
      <path d="M10 40.5 Q32 34 54 40.5 L54 47 Q32 40.5 10 47 Z"/>
      <path d="M10 49 Q32 42.5 54 49 L54 51.5 Q54 55 50.5 55 H13.5 Q10 55 10 51.5 Z"/>
      <rect x="28.5" y="29" width="7" height="26"/>
    </g>
    <path fill="#D9A441" d="M55.5 6 Q56.4 9.1 59.5 10 Q56.4 10.9 55.5 14 Q54.6 10.9 51.5 10 Q54.6 9.1 55.5 6 Z"/>
  </svg>
  <h1>openchest</h1>
  <form id="login">
    <label>Email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Open</button>
  </form>
  <p id="notice"></p>
  <footer><a href="impressum.html">Impressum &amp; Datenschutz</a></footer>
</main>
<script>
  // Placeholder: replace this handler with a real authentication call later.
  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('notice').textContent = 'The chest isn’t open yet — come back soon.';
  });
</script>
</body>
</html>
